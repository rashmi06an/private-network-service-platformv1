<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 230"><style>text{font:12px Arial,sans-serif;text-anchor:middle;fill:#17324a}.strong{font-weight:bold;font-size:14px}</style><rect x="40" y="10" width="650" height="45" rx="8" fill="#163f67"/><text x="365" y="38" style="fill:white;font-size:16px">Private Wi-Fi / LAN — four existing Macs</text><path d="M90,55 V95" stroke="#60788e" stroke-width="2"/><rect x="10" y="95" width="160" height="112" rx="8" fill="#eef5fb" stroke="#1b537e"/><text x="90" y="119" class="strong">Mac 1 · Rashmi</text><text x="90" y="142">DNS + client</text><text x="90" y="164">10.7.17.21</text><text x="90" y="188">53 UDP/TCP</text><path d="M270,55 V95" stroke="#60788e" stroke-width="2"/><rect x="190" y="95" width="160" height="112" rx="8" fill="#eef5fb" stroke="#1b537e"/><text x="270" y="119" class="strong">Mac 2 · Samiksha</text><text x="270" y="142">TLS edge / load balancer</text><text x="270" y="164">10.7.7.9</text><text x="270" y="188">8080 / 8443 TCP</text><path d="M450,55 V95" stroke="#60788e" stroke-width="2"/><rect x="370" y="95" width="160" height="112" rx="8" fill="#eef5fb" stroke="#1b537e"/><text x="450" y="119" class="strong">Mac 3 · Shubhaang</text><text x="450" y="142">Backend A</text><text x="450" y="164">10.7.21.15</text><text x="450" y="188">3001 TCP</text><path d="M630,55 V95" stroke="#60788e" stroke-width="2"/><rect x="550" y="95" width="160" height="112" rx="8" fill="#eef5fb" stroke="#1b537e"/><text x="630" y="119" class="strong">Mac 4 · Ankit</text><text x="630" y="142">Backend B + client</text><text x="630" y="164">10.7.23.47</text><text x="630" y="188">3002 TCP</text><text x="365" y="226">Role topology; connecting lines represent LAN membership, not physical Ethernet cables.</text></svg>
